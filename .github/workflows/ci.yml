name: CI

# Runs on every pull request and on pushes to main: unit tests + Android Lint. Keeps `main` green.
# (Instrumentation tests on a cloud device matrix + detekt/ktlint land with the QA phase.)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew

      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-test-output.txt

      # Why this exists: the dev machine has no `gh` CLI and no API token, and BOTH the job log and the
      # uploaded artifacts require authentication to download. Check-run ANNOTATIONS do not — they are
      # readable from the plain REST API. So on failure we re-emit the lines that actually say what broke
      # as `::error::` annotations, which is the only channel that reaches the developer. Without this, a
      # red build is indistinguishable from any other red build without opening a browser and signing in.
      - name: Surface the failure as annotations
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo "::group::extracted failure lines"
          # Kotlin compile errors (`e: file:line:col: message`), Gradle task failures, and JUnit
          # assertion failures - the three ways this step can go red.
          grep -E "^e: |^w: .*error|FAILED$|^Execution failed|^\* What went wrong|^Caused by|expected:|AssertionError|Tests? .*(failed|FAILED)" \
            gradle-test-output.txt | head -60 > failures.txt || true
          if [ ! -s failures.txt ]; then
            # Nothing matched the patterns - fall back to the tail so the build is never silently red.
            tail -40 gradle-test-output.txt > failures.txt
          fi
          cat failures.txt
          echo "::endgroup::"
          while IFS= read -r line; do
            # Strip characters that would break the annotation encoding.
            printf '::error::%s\n' "$(printf '%s' "$line" | tr -d '\r' | cut -c1-400)"
          done < failures.txt

      - name: Android Lint (informational)
        run: ./gradlew lintDebug --no-daemon --stacktrace

      # Full Gradle console output as an artifact: compile errors never reach the HTML test
      # reports, and this machine polls CI anonymously (no gh CLI / no API token for job logs).
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: gradle-test-output.txt
          if-no-files-found: ignore

      - name: Upload test + lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
